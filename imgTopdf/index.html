<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to PDF Converter</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col items-center justify-center p-6">

    <div class="bg-white p-8 rounded-xl shadow-md max-w-md w-full text-center">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Image to PDF Converter</h1>
        <p class="text-gray-500 text-sm mb-6">Convert your JPG or PNG images into a single PDF instantly.</p>

        <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 hover:border-blue-500 transition cursor-pointer relative bg-gray-50" id="dropzone">
            <input type="file" id="imageInput" accept="image/*" multiple class="absolute inset-0 opacity-0 cursor-pointer">
            <svg class="mx-auto h-12 w-12 text-gray-400 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            <p class="text-sm text-gray-600 font-medium">Click to upload or drag and drop</p>
            <p class="text-xs text-gray-400 mt-1">PNG, JPG, JPEG up to 10MB</p>
        </div>

        <div id="fileCount" class="text-sm text-gray-600 my-4 hidden">
            <span id="countNumber" class="font-semibold text-blue-600">0</span> image(s) selected.
        </div>

        <button id="convertBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg shadow transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed mt-2" disabled>
            Convert to PDF
        </button>
    </div>

    <script>
        const { jsPDF } = window.jspdf;
        const imageInput = document.getElementById('imageInput');
        const convertBtn = document.getElementById('convertBtn');
        const fileCount = document.getElementById('fileCount');
        const countNumber = document.getElementById('countNumber');

        let selectedFiles = [];

        // Listen for file selection
        imageInput.addEventListener('change', (e) => {
            selectedFiles = Array.from(e.target.files);
            
            if (selectedFiles.length > 0) {
                countNumber.textContent = selectedFiles.length;
                fileCount.classList.remove('hidden');
                convertBtn.disabled = false;
            } else {
                fileCount.classList.add('hidden');
                convertBtn.disabled = true;
            }
        });

        // Convert process
        convertBtn.addEventListener('click', async () => {
            if (selectedFiles.length === 0) return;

            convertBtn.textContent = 'Converting...';
            convertBtn.disabled = true;

            const pdf = new jsPDF();

            for (let i = 0; i < selectedFiles.length; i++) {
                const file = selectedFiles[i];
                
                // Read image file as DataURL
                const imageData = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (event) => resolve(event.target.result);
                    reader.readAsDataURL(file);
                });

                // If it's not the first page, add a new page
                if (i > 0) {
                    pdf.addPage();
                }

                // Get PDF page dimensions
                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();

                // Add image to PDF (scaled to fit the page size)
                pdf.addImage(imageData, 'JPEG', 0, 0, pageWidth, pageHeight);
            }

            // Save the PDF
            pdf.save('converted-images.pdf');

            // Reset UI
            convertBtn.textContent = 'Convert to PDF';
            convertBtn.disabled = false;
        });
    </script>
</body>
</html>
